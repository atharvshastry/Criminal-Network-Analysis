
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sih26189
      POSTGRES_USER: sih
      POSTGRES_PASSWORD: sih_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/sih_dev_password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
  neo4j_data:
